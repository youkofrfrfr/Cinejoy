<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f1e8">
  <title>Private Access</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #17201a;
      --muted: #667068;
      --paper: #f4f1e8;
      --paper-strong: #fffefa;
      --lime: #b7f34a;
      --line: #d8d3c5;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100svh;
      margin: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      color: var(--ink);
      background:
        radial-gradient(circle at 18% 22%, rgba(183, 243, 74, .38), transparent 19rem),
        linear-gradient(135deg, rgba(23, 32, 26, .045) 1px, transparent 1px),
        var(--paper);
      background-size: auto, 26px 26px, auto;
      font-family: Georgia, "Times New Roman", serif;
    }

    main {
      width: 100%;
      height: 100svh;
      padding: 0;
      background: var(--paper);
    }

    main.embedded {
      position: absolute;
      width: 0;
      height: 0;
      opacity: 0;
      pointer-events: none;
      overflow: hidden;
    }

    #cinejoy {
      display: none;
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      border: 0;
      background: #fff;
    }

    body.ready {
      display: block;
      overflow: hidden;
    }

    body.ready #cinejoy { display: block; }

    .brand {
      display: flex;
      align-items: center;
      gap: .8rem;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: .72rem;
      letter-spacing: .18em;
      text-transform: uppercase;
    }

    .brand-mark {
      width: 2.25rem;
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      border: 1px solid var(--ink);
      background: var(--lime);
      transform: rotate(-4deg);
    }

    h1 {
      max-width: 11ch;
      margin: 8vh 0 1rem;
      font-size: clamp(3.5rem, 12vw, 8.5rem);
      font-weight: 400;
      line-height: .82;
      letter-spacing: 0;
    }

    .subtitle {
      max-width: 34rem;
      margin: 0;
      color: var(--muted);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: clamp(.85rem, 2vw, 1rem);
      line-height: 1.7;
    }

    dialog {
      width: min(92vw, 31rem);
      border: 1px solid var(--ink);
      border-radius: 8px;
      padding: 0;
      color: var(--ink);
      background: var(--paper-strong);
      box-shadow: 18px 18px 0 rgba(23, 32, 26, .18);
    }

    dialog::backdrop {
      background: rgba(23, 32, 26, .72);
      backdrop-filter: blur(8px);
    }

    .dialog-topline {
      height: .55rem;
      background: var(--lime);
      border-bottom: 1px solid var(--ink);
    }

    .dialog-body { padding: clamp(1.5rem, 5vw, 2.5rem); }

    .eyebrow {
      margin: 0 0 .8rem;
      color: var(--muted);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: .72rem;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    dialog h2 {
      margin: 0;
      font-size: clamp(2.2rem, 8vw, 4.2rem);
      font-weight: 400;
      line-height: .92;
      letter-spacing: 0;
    }

    dialog p {
      margin: 1.2rem 0 1.8rem;
      color: var(--muted);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      line-height: 1.6;
    }

    .actions { display: flex; gap: .65rem; }

    button {
      min-height: 3.2rem;
      border: 1px solid var(--ink);
      border-radius: 4px;
      padding: .8rem 1.1rem;
      font: 700 .82rem/1 ui-monospace, SFMono-Regular, Menlo, monospace;
      letter-spacing: .04em;
      cursor: pointer;
    }

    #continue {
      flex: 1;
      background: var(--lime);
    }

    #cancel { background: transparent; }

    button:focus-visible {
      outline: 3px solid #4d8cff;
      outline-offset: 3px;
    }

    @media (max-width: 560px) {
      main { padding: 1.25rem; }
      h1 { margin-top: 14vh; }
      .actions { flex-direction: column-reverse; }
    }

    @media (prefers-reduced-motion: no-preference) {
      main { animation: arrive .7s cubic-bezier(.2,.8,.2,1) both; }
      dialog[open] { animation: arrive .35s cubic-bezier(.2,.8,.2,1) both; }
      @keyframes arrive {
        from { opacity: 0; transform: translateY(16px); }
        to { opacity: 1; transform: translateY(0); }
      }
    }
  </style>
</head>
<body>
  <main id="landing">
    <div class="brand"><span class="brand-mark">S</span> Selective access</div>
    <h1>One door. One choice.</h1>
    <p class="subtitle">Access the Cinejoy experience in a controlled, same-origin viewing surface.</p>
  </main>
  <iframe id="cinejoy" title="Cinejoy" allowfullscreen></iframe>

  <dialog id="access-dialog" aria-labelledby="access-title">
    <div class="dialog-topline"></div>
    <div class="dialog-body">
      <p class="eyebrow">Private link</p>
      <h2 id="access-title">Continue to secret site</h2>
      <p>The original Cinejoy app will load in this page. The known ad loader is excluded from the app shell.</p>
      <div class="actions">
        <button id="cancel" type="button">Cancel</button>
        <button id="continue" type="button">Continue</button>
      </div>
    </div>
  </dialog>

  <script>
    const dialog = document.querySelector('#access-dialog');

    dialog.showModal();
    document.querySelector('#continue').addEventListener('click', () => {
      const frame = document.querySelector('#cinejoy');
      frame.src = '/cinejoy?embed=1';
      document.body.classList.add('ready');
      document.querySelector('#landing').classList.add('embedded');
      dialog.close();
      frame.focus();
    });
    document.querySelector('#cancel').addEventListener('click', () => dialog.close());
  </script>
</body>
</html>
