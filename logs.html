<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>Cinejoy Error Logs</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #f5f7f2;
      --muted: #a6aea5;
      --panel: #171c18;
      --panel-2: #0d110f;
      --lime: #b7f34a;
      --line: #343c35;
      --error: #ff766c;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100svh;
      margin: 0;
      padding: 24px;
      color: var(--ink);
      background: radial-gradient(circle at top left, rgba(183, 243, 74, .08), transparent 22rem), #0b0e0c;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    main {
      width: min(1100px, 100%);
      margin: 0 auto;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(2rem, 7vw, 4rem);
      font-weight: 400;
    }

    .actions {
      display: flex;
      gap: 8px;
    }

    button {
      min-height: 42px;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 10px 14px;
      color: var(--ink);
      background: var(--panel);
      font: 700 .78rem/1 ui-monospace, SFMono-Regular, Menlo, monospace;
      cursor: pointer;
    }

    button.primary {
      border-color: var(--lime);
      color: #10150f;
      background: var(--lime);
    }

    #meta {
      margin: 0 0 12px;
      color: var(--muted);
      font-size: .78rem;
    }

    pre {
      min-height: 60svh;
      margin: 0;
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 16px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      color: var(--ink);
      background: var(--panel-2);
      line-height: 1.55;
    }

    .empty { color: var(--muted); }

    @media (max-width: 560px) {
      body { padding: 14px; }
      header { align-items: flex-start; }
      .actions { flex-direction: column; }
      button { min-height: 38px; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Error logs</h1>
      <div class="actions">
        <button id="clear" type="button">Clear</button>
        <button id="copy" class="primary" type="button">Copy logs</button>
      </div>
    </header>
    <p id="meta"></p>
    <pre id="logs"></pre>
  </main>

  <script>
    const STORAGE_KEY = 'cinejoy-error-logs-v1';
    const logs = document.querySelector('#logs');
    const meta = document.querySelector('#meta');
    const copyButton = document.querySelector('#copy');

    function readLogs() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
      } catch {
        return [];
      }
    }

    function render() {
      const entries = readLogs();
      const text = entries.length
        ? entries.map(entry => `[${entry.time}] ${entry.type}: ${entry.message}`).join('\n')
        : 'No Cinejoy errors recorded.';
      logs.textContent = text;
      logs.classList.toggle('empty', entries.length === 0);
      meta.textContent = entries.length
        ? `${entries.length} recorded event${entries.length === 1 ? '' : 's'} on ${location.hostname}`
        : `Waiting for events on ${location.hostname}`;
    }

    document.querySelector('#clear').addEventListener('click', () => {
      localStorage.removeItem(STORAGE_KEY);
      render();
    });

    copyButton.addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(logs.textContent);
        copyButton.textContent = 'Copied';
        setTimeout(() => { copyButton.textContent = 'Copy logs'; }, 1400);
      } catch {
        const range = document.createRange();
        range.selectNodeContents(logs);
        const selection = window.getSelection();
        selection.removeAllRanges();
        selection.addRange(range);
        document.execCommand('copy');
      }
    });

    render();
  </script>
</body>
</html>
